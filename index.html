<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d;
    --surface:#121417;
    --surface-2:#171a1e;
    --line:#23272d;
    --line-soft:#1b1f24;
    --text:#e6e9ed;
    --muted:#6f7780;
    --muted-2:#8a939d;
    --gold:#d9b45f;
    --gold-dim:#8a7238;
    --danger:#d9544f;
    --ok:#5fb87a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;min-height:100vh;min-height:100dvh;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:max(32px,env(safe-area-inset-bottom));}

  /* ---------- topo ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    padding:calc(env(safe-area-inset-top) + 16px) 20px 13px;
    background:rgba(10,11,13,.82);backdrop-filter:blur(14px) saturate(150%);
    border-bottom:1px solid var(--line-soft);
  }
  .brand{display:flex;align-items:baseline;gap:9px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;}
  .brand .pip{width:6px;height:6px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 3px rgba(217,180,95,.14);align-self:center;}
  .brand span{font-family:'JetBrains Mono',monospace;font-weight:400;font-size:10.5px;
    color:var(--muted);letter-spacing:.14em;margin-left:auto;}

  .wrap{max-width:540px;margin:0 auto;padding:16px 14px 40px;}

  /* ---------- cartões ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:17px;margin-bottom:14px;}
  .card h2{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:0 0 13px;}

  label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px;
    font-family:'JetBrains Mono',monospace;letter-spacing:.02em;}
  input[type=text],input[type=password]{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;
    padding:13px 14px;color:var(--text);font-size:15px;
    font-family:'JetBrains Mono',monospace;outline:none;
    transition:border-color .15s ease;
  }
  input:focus{border-color:var(--gold-dim);}
  input::placeholder{color:#454c54;}

  button{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
    letter-spacing:.04em;border:none;border-radius:11px;padding:13px 16px;
    cursor:pointer;text-transform:uppercase;transition:opacity .15s ease;}
  button:active{opacity:.75;}
  .btn-main{background:var(--gold);color:#191307;width:100%;margin-top:13px;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted-2);
    font-size:11px;padding:10px 12px;flex:1;}
  .btn-link{background:none;border:none;color:var(--muted);
    font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:none;
    letter-spacing:0;text-decoration:underline;text-underline-offset:3px;padding:6px 0;}

  .hint{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.6;}
  .hint a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold-dim);}

  /* ---------- resumo ---------- */
  .summary{position:sticky;top:calc(env(safe-area-inset-top) + 52px);z-index:20;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:16px 17px;margin-bottom:14px;
    box-shadow:0 10px 26px -12px rgba(0,0,0,.85);}
  .sum-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .sum-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.13em;margin-bottom:5px;}
  .sum-usd{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:27px;
    color:var(--gold);letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;}
  .sum-alt{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted-2);
    margin-top:7px;font-variant-numeric:tabular-nums;}
  .sum-alt b{color:var(--text);font-weight:500;}
  .sum-count{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);
    text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .sum-actions{display:flex;gap:8px;margin-top:15px;}
  .warn{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--gold);
    margin-top:13px;padding-top:11px;border-top:1px solid var(--line);line-height:1.5;}

  /* ---------- item ---------- */
  .item{display:flex;align-items:flex-start;gap:11px;padding:12px 13px 12px 11px;
    border-radius:13px;background:var(--surface);border:1px solid var(--line-soft);
    margin-bottom:7px;position:relative;overflow:hidden;}
  .item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--rarity,#3a4048);}
  .item.off{opacity:.42;}

  .check{appearance:none;-webkit-appearance:none;width:19px;height:19px;flex-shrink:0;
    border:1.5px solid #3a4048;border-radius:6px;background:var(--bg);cursor:pointer;
    position:relative;margin:1px 0 0 3px;transition:all .12s ease;}
  .check:checked{background:var(--gold);border-color:var(--gold);}
  .check:checked::after{content:'';position:absolute;left:6px;top:2px;width:4px;height:9px;
    border:solid #191307;border-width:0 2px 2px 0;transform:rotate(42deg);}

  .thumb{width:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .thumb img{width:52px;height:40px;object-fit:contain;
    background:radial-gradient(circle at 50% 45%,#1e232a,#101317);border-radius:7px;}
  .meta{font-family:'JetBrains Mono',monospace;font-size:8px;line-height:1.45;
    color:var(--muted);text-align:center;letter-spacing:.01em;font-variant-numeric:tabular-nums;}
  .meta b{color:var(--muted-2);font-weight:500;}

  /* barra de desgaste — zonas reais do CS2 */
  .wear{width:52px;height:3px;border-radius:2px;position:relative;
    background:linear-gradient(90deg,
      #4b9e5f 0%,#4b9e5f 7%,
      #8fb84b 7%,#8fb84b 15%,
      #d4b04a 15%,#d4b04a 38%,
      #d4834a 38%,#d4834a 45%,
      #c25146 45%,#c25146 100%);
    opacity:.5;}
  .wear i{position:absolute;top:-2.5px;width:2px;height:8px;border-radius:1px;
    background:#fff;box-shadow:0 0 4px rgba(0,0,0,.9);transform:translateX(-1px);}

  .body{flex:1;min-width:0;padding-top:1px;}
  .nm{font-size:13px;line-height:1.35;font-weight:450;letter-spacing:-.005em;}
  .phase{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;
    font-weight:500;padding:2px 7px;border-radius:5px;margin-left:5px;
    background:rgba(217,180,95,.13);color:var(--gold);
    border:1px solid rgba(217,180,95,.22);letter-spacing:.04em;
    vertical-align:1px;white-space:nowrap;}

  .price{text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .p-usd{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;
    letter-spacing:-.02em;}
  .p-alt{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted-2);
    line-height:1.5;margin-top:2px;}
  .p-src{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--muted);
    margin-top:4px;letter-spacing:.02em;}
  .p-none{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}

  .raw{display:none;white-space:pre-wrap;word-break:break-all;font-size:9.5px;
    line-height:1.5;color:var(--muted-2);background:var(--bg);padding:10px;
    border-radius:8px;margin-top:8px;max-height:190px;overflow:auto;
    font-family:'JetBrains Mono',monospace;border:1px solid var(--line);}

  /* ---------- estados ---------- */
  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:34px 14px;
    font-family:'JetBrains Mono',monospace;line-height:1.6;}
  .error{background:rgba(217,84,79,.09);border:1px solid rgba(217,84,79,.3);
    color:#e89b98;padding:13px 14px;border-radius:12px;font-size:12.5px;
    margin-bottom:13px;font-family:'JetBrains Mono',monospace;line-height:1.55;}
  .loading{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;
    font-family:'JetBrains Mono',monospace;padding:12px 2px 2px;}
  .spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--gold);animation:sp .65s linear infinite;flex-shrink:0;}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><i class="pip"></i>Ticker<span>YOUPIN898</span></div>
  </div>

  <div class="wrap">
    <div id="setup" class="card" style="display:none">
      <h2>Configuração</h2>
      <label for="keyIn">Chave da steamwebapi.com</label>
      <input type="password" id="keyIn" placeholder="cole sua chave aqui" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn-main" id="saveBtn">Salvar chave</button>
      <div class="hint">
        Entre em <a href="https://www.steamwebapi.com/dashboard" target="_blank" rel="noopener">steamwebapi.com/dashboard</a>, faça login com a Steam e copie a chave do painel. Ela fica salva só neste aparelho.
      </div>
    </div>

    <div id="main" class="card" style="display:none">
      <h2>Consultar inventário</h2>
      <label for="linkIn">Tradelink do cliente</label>
      <input type="text" id="linkIn" placeholder="https://steamcommunity.com/tradeoffer/new/?partner=…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn-main" id="goBtn">Consultar preços</button>
      <div id="load"></div>
      <button class="btn-link" id="chBtn">trocar chave de api</button>
    </div>

    <div id="err"></div>
    <div id="out"></div>
  </div>

<script>
const KEY='swa_api_key';
let apiKey=null, rates={BRL:null,CNY:null}, items=[];

const $=id=>document.getElementById(id);
const setup=$('setup'), main=$('main'), keyIn=$('keyIn'), linkIn=$('linkIn'),
      err=$('err'), out=$('out'), load=$('load');

const showErr=m=>{err.innerHTML=`<div class="error">${m}</div>`;};
const clrErr=()=>{err.innerHTML='';};

/* ---------- chave ---------- */
try{
  const v=localStorage.getItem(KEY);
  if(v){apiKey=v;main.style.display='block';} else setup.style.display='block';
}catch(e){setup.style.display='block';}

$('saveBtn').onclick=()=>{
  const v=keyIn.value.trim();
  if(!v){showErr('Cole sua chave de API antes de salvar.');return;}
  clrErr();
  try{
    localStorage.setItem(KEY,v);apiKey=v;
    setup.style.display='none';main.style.display='block';
  }catch(e){showErr('Não consegui salvar a chave neste aparelho.');}
};

$('chBtn').onclick=()=>{
  main.style.display='none';out.innerHTML='';clrErr();
  keyIn.value=apiKey||'';setup.style.display='block';
};

/* ---------- tradelink -> steamid64 ---------- */
function partnerOf(link){
  const m=link.match(/[?&]partner=(\d+)/);
  return m?m[1]:null;
}
const toSteamId64=id=>(76561197960265728n+BigInt(id)).toString();

/* ---------- preço ---------- */
function priceOf(it){
  const ph=it?.float?.phase??null, pi=it?.float?.paintindex??null;
  // fase específica (Doppler, Gamma, Ruby, Sapphire, Esmeralda, Black Pearl…)
  if(ph&&Array.isArray(it?.variants)&&it.variants.length){
    let v=null;
    if(pi!==null) v=it.variants.find(x=>x.paintindex===pi);
    if(!v){
      const t=String(ph).toLowerCase().replace(/\s+/g,'');
      v=it.variants.find(x=>String(x.phase||'').toLowerCase().replace(/\s+/g,'')===t);
    }
    if(v&&typeof v.pricereal==='number') return {price:v.pricereal,src:'Youpin · '+v.phase};
  }
  if(typeof it?.pricereal==='number') return {price:it.pricereal,src:'Youpin'};
  const fb=it?.pricelatestsell??it?.pricemedian??it?.pricelatest??it?.pricemix;
  const n=typeof fb==='number'?fb:(typeof fb==='string'?parseFloat(fb):NaN);
  if(!isNaN(n)&&n!==null) return {price:n,src:'Steam · sem dado Youpin'};
  return null;
}

/* ---------- cotações ---------- */
async function getRates(){
  try{
    const r=await fetch('https://api.frankfurter.dev/v1/latest?from=USD&to=BRL,CNY');
    if(!r.ok) throw 0;
    const d=await r.json();
    rates.BRL=d.rates.BRL;rates.CNY=d.rates.CNY;
  }catch(e){rates.BRL=null;rates.CNY=null;}
}

const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=n=>'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const cny=n=>'¥ '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------- inventário ---------- */
async function getInv(id){
  const u=`https://www.steamwebapi.com/steam/api/inventory?steam_id=${id}&game=cs2`
        +`&key=${encodeURIComponent(apiKey)}&with_prices=true&markets=youpin`
        +`&with_phase_price=true&limit=5000`;
  const r=await fetch(u);
  if(r.status===401||r.status===403) throw new Error('Chave de API recusada. Toque em "trocar chave de api" e confira.');
  if(r.status===429) throw new Error('Limite de consultas atingido. Espere um pouco e tente de novo.');
  if(!r.ok) throw new Error(`A API respondeu com erro ${r.status}. O inventário do cliente pode estar privado.`);
  const d=await r.json();
  if(Array.isArray(d)) return d;
  if(Array.isArray(d.items)) return d.items;
  if(Array.isArray(d.data)) return d.data;
  throw new Error('Resposta da API em formato inesperado.');
}

/* ---------- ação principal ---------- */
$('goBtn').onclick=async()=>{
  clrErr();out.innerHTML='';
  const link=linkIn.value.trim();
  if(!link){showErr('Cole o tradelink do cliente primeiro.');return;}
  const p=partnerOf(link);
  if(!p){showErr('Não achei o "partner=" nesse link. Confira se colou o tradelink completo.');return;}

  load.innerHTML='<div class="loading"><i class="spin"></i>Buscando inventário e preços…</div>';
  try{
    const [inv]=await Promise.all([getInv(toSteamId64(p)),getRates()]);
    load.innerHTML='';
    build(inv);
  }catch(e){
    load.innerHTML='';
    showErr(e.message||'Algo deu errado na consulta.');
  }
};

/* ---------- montar lista ---------- */
function build(list){
  if(!list||!list.length){
    out.innerHTML='<div class="empty">Nenhum item encontrado.<br>O inventário pode estar privado.</div>';
    return;
  }
  items=list.map((it,i)=>{
    const pr=priceOf(it);
    const f=it.float?.floatvalue??null;
    return{
      i,
      name:it.markethashname||it.marketname||'Item sem nome',
      img:it.image||'',
      rarity:it.bordercolor||it.color||null,
      price:pr?pr.price:null,
      src:pr?pr.src:null,
      float:typeof f==='number'?f:(f?parseFloat(f):null),
      seed:it.float?.paintseed??null,
      phase:it.float?.phase??null,
      raw:it,
      on:true
    };
  }).sort((a,b)=>(b.price??-1)-(a.price??-1));
  draw();
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function draw(){
  const on=items.filter(x=>x.on);
  const tot=on.reduce((s,x)=>s+(x.price??0),0);
  const none=on.filter(x=>x.price===null).length;

  let h=`<div class="summary">
    <div class="sum-top">
      <div>
        <div class="sum-label">Valor selecionado</div>
        <div class="sum-usd">${rates.BRL?brl(tot*rates.BRL):'R$ —'}</div>
        <div class="sum-alt"><b>${usd(tot)}</b> &nbsp;·&nbsp; ${rates.CNY?cny(tot*rates.CNY):'¥ —'}</div>
      </div>
      <div class="sum-count">${on.length}/${items.length}<br>itens</div>
    </div>
    <div class="sum-actions">
      <button class="btn-ghost" id="allBtn">Selecionar tudo</button>
      <button class="btn-ghost" id="noneBtn">Desmarcar tudo</button>
    </div>
    ${!rates.BRL?`<div class="warn">Não consegui buscar a cotação do dia — os valores em real e yuan estão indisponíveis. Consulte de novo em instantes.</div>`:''}
    ${none?`<div class="warn">${none} ${none===1?'item selecionado está':'itens selecionados estão'} sem preço e não ${none===1?'entra':'entram'} no total.</div>`:''}
  </div>`;

  h+=items.map(x=>{
    const rar=x.rarity?`--rarity:#${esc(x.rarity)}`:'';
    const img=x.img?`<img src="${esc(x.img)}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">`:'';

    let meta='';
    if(x.float!==null){
      meta+=`<div class="wear"><i style="left:${Math.min(100,Math.max(0,x.float*100))}%"></i></div>`;
      meta+=`<div class="meta"><b>${x.float.toFixed(4)}</b>`;
      if(x.seed!==null) meta+=`<br>seed ${x.seed}`;
      meta+=`</div>`;
    } else if(x.seed!==null){
      meta+=`<div class="meta">seed ${x.seed}</div>`;
    }

    const nm=esc(x.name)+(x.phase?`<span class="phase">${esc(x.phase)}</span>`:'');

    const pr=x.price!==null
      ? `<div class="p-usd">${rates.BRL?brl(x.price*rates.BRL):'R$ —'}</div>
         <div class="p-alt">${usd(x.price)}<br>${rates.CNY?cny(x.price*rates.CNY):'¥ —'}</div>
         <div class="p-src">${esc(x.src)}</div>`
      : `<div class="p-none">—</div><div class="p-src">sem preço</div>`;

    return `<div class="item${x.on?'':' off'}" style="${rar}">
      <input type="checkbox" class="check" data-i="${x.i}"${x.on?' checked':''}>
      <div class="thumb">${img}${meta}</div>
      <div class="body">
        <div class="nm">${nm}</div>
        <button class="btn-link raw-btn" data-i="${x.i}">ver dados brutos</button>
        <pre class="raw" data-i="${x.i}"></pre>
      </div>
      <div class="price">${pr}</div>
    </div>`;
  }).join('');

  out.innerHTML=h;

  $('allBtn').onclick=()=>{items.forEach(x=>x.on=true);draw();};
  $('noneBtn').onclick=()=>{items.forEach(x=>x.on=false);draw();};

  out.querySelectorAll('.check').forEach(c=>{
    c.onchange=e=>{
      const it=items.find(x=>x.i==e.target.dataset.i);
      if(it) it.on=e.target.checked;
      draw();
    };
  });
  out.querySelectorAll('.raw-btn').forEach(b=>{
    b.onclick=e=>{
      const i=e.target.dataset.i;
      const pre=out.querySelector(`.raw[data-i="${i}"]`);
      if(pre.style.display==='block'){pre.style.display='none';e.target.textContent='ver dados brutos';}
      else{
        pre.textContent=JSON.stringify(items.find(x=>x.i==i).raw,null,2);
        pre.style.display='block';e.target.textContent='ocultar dados brutos';
      }
    };
  });
}
</script>
</body>
</html>
